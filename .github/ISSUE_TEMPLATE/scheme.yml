name: 方案讨论
description: 对 SOLUTION.md 的结论提出质疑、补充证据，或提交实现
title: "[discuss] "
body:
  - type: dropdown
    id: kind
    attributes:
      label: 类型
      options:
        - 方案结论有误 / 需要修正
        - 补充逆向或实测证据
        - 提交实现（对照目标架构与指标）
        - 文档改进
    validations:
      required: true
  - type: textarea
    id: claim
    attributes:
      label: 涉及文档中的哪一条
      description: 引用 `README.md` / `SOLUTION.md` 的具体段落。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 证据
      description: >
        你复现/验证了什么？贴解包结果、抓包片段、日志、实测数据。
        没有证据的"我觉得不行"会被搁置。
      render: text
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你的结论 / 建议
